{% extends "base.html" %}

{% block content %}
<div class="welcome-section">
    <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Siklus Pengeluaran (Expenditure)</h1>
    <p style="color: var(--text-muted);">Pencairan dana pembiayaan (akad) dan distribusi perhitungan nisbah bagi hasil.</p>
</div>

<div class="glass-card" style="max-width: 600px; margin-top: 2rem;">
    <form hx-post="/api/finance/expenditure" hx-target="#toast-container" hx-swap="innerHTML">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Jenis Pengeluaran</label>
            <select name="type" style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main);">
                <option value="pencairan_pembiayaan">Pencairan Dana Pembiayaan</option>
                <option value="bagi_hasil_nisbah">Distribusi Bagi Hasil (Nisbah)</option>
                <option value="operasional">Biaya Operasional Umum</option>
            </select>
        </div>
        
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Nominal Keluar (Rp)</label>
            <input type="number" name="amount" required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main);" placeholder="Misal: 1000000">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Tujuan / Keterangan</label>
            <textarea name="description" rows="3" required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main);" placeholder="Keterangan pengeluaran (misal: Nisbah Bulan April)..."></textarea>
            <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">*Sistem secara otomatis membaca nisbah persentase default dari database sesuai persetujuan di akad kontrak.</small>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; background: var(--accent);">
            Proses Pengeluaran
        </button>
    </form>
</div>
{% endblock %}

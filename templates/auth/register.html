{% extends "public_base.html" %}

{% block content %}
<div class="glass-card animate-up" style="width: 100%; max-width: 450px; padding: 2.5rem;">
    <h2 style="margin-bottom: 0.5rem;">Pendaftaran</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Bergabung dengan mufakat digital Koperasi IQ-RA</p>

    <div id="auth-alert"></div>

    <form hx-post="/register" hx-target="#auth-alert">
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" name="full_name" class="form-control" required placeholder="Ahmad Syarif">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required placeholder="user@domain.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required placeholder="Min 6 karakter">
        </div>
        <div class="form-group">
            <label>Tipe Akun</label>
            <select name="role" class="form-control">
                <option value="member">Anggota Reguler</option>
                <option value="demo">Akun Uji Coba (Demo)</option>
            </select>
        </div>
        <button type="submit" class="btn-gold" style="width: 100%; justify-content: center;">Daftar Sekarang</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem;">
        Sudah punya akun? <a href="/login" style="color: var(--gold-solid); text-decoration: none; font-weight: 700;">Masuk</a>
    </div>
</div>
{% endblock %}

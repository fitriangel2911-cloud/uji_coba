{% extends "public_base.html" %}

{% block content %}
<div class="glass-card animate-up" style="width: 100%; max-width: 400px; padding: 2.5rem;">
    <h2 style="margin-bottom: 0.5rem; color: #fbbf24;">Login Demo</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Mode pengujian system (Maks 2x Login per akun)</p>

    <div id="auth-alert"></div>

    <form hx-post="/login-demo" hx-target="#auth-alert">
        <div class="form-group">
            <label>Email Demo</label>
            <input type="email" name="email" class="form-control" required placeholder="demo@iqra-demo.com">
        </div>
        <div class="form-group" style="margin-bottom: 2rem;">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; background: linear-gradient(135deg, #fbbf24, #d97706);">Mulai Demo</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; display: flex; flex-direction: column; gap: 0.75rem;">
        <div>Belum punya akun demo? <a href="/register?role=demo" style="color: var(--gold-solid); text-decoration: none; font-weight: 700;">Daftar Demo</a></div>
        <a href="/login" style="color: var(--text-muted); text-decoration: none;">← Kembali ke Login Reguler</a>
    </div>
</div>
{% endblock %}

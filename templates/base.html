<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ-RA System | Koperasi Syariah Digital</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Alpine JS -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body x-data="{ sidebarOpen: true }">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" x-show="sidebarOpen" x-transition:enter="transition ease-out duration-300" 
               x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>IQ-RA SYSTEM</span>
            </div>
            
            <nav>
                <ul>
                    <li><a href="/" class="active">Beranda</a></li>
                    <li><a href="#">Keanggotaan (KYC)</a></li>
                    <li><a href="/finance" :class="window.location.pathname === '/finance' ? 'active' : ''">Manajemen Keuangan</a></li>
                    <li><a href="#">Simulasi Perbankan</a></li>
                    <li><a href="#">Laporan Keuangan</a></li>
                </ul>
            </nav>

            <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--glass-border);">
                <a href="#" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Sharia Assistant (RAG)</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header class="top-bar">
                <button @click="sidebarOpen = !sidebarOpen" class="btn-primary" style="padding: 0.5rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span>Fitri Angelina (Admin)</span>
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold;">
                        FA
                    </div>
                </div>
            </header>

            <div id="main-content" class="animate-fade-in">
                {% block content %}{% endblock %}
            </div>
        </main>
        
        <!-- Toast Notification Container -->
        <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 50;"></div>
    </div>

    <script>
        // HTMX indicator logic if needed
        document.body.addEventListener('htmx:beforeSend', function(evt) {
            // Can show a loader here
        });
    </script>
</body>
</html>

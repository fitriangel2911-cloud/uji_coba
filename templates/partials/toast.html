<!-- HTMX akan mereplace isi div#toast-container dengan elemen ini -->
<div class="toast" x-data="{ show: true }" x-show="show" 
     x-init="setTimeout(() => show = false, 5000)"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 transform translate-y-2"
     x-transition:enter-end="opacity-100 transform translate-y-0"
     x-transition:leave="transition ease-in duration-300"
     x-transition:leave-start="opacity-100 transform translate-y-0"
     x-transition:leave-end="opacity-0 transform translate-y-2"
     style="padding: 1rem 1.5rem; border-radius: 8px; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
     {% if type == 'success' %}background: #10b981; color: white; border: 1px solid #059669;{% else %}background: #ef4444; color: white; border: 1px solid #b91c1c;{% endif %}">
    
    <span>{{ message }}</span>
    
    <button @click="show = false" style="background: none; border: none; color: white; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
</div>

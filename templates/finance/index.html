{% extends "base.html" %}

{% block page_title %}Pusat Operasional Keuangan{% endblock %}

{% block content %}
<div class="animate-up" style="display: grid; grid-template-columns: 1.2fr 2fr; gap: 2rem;">
    <!-- Form Entry -->
    <div class="glass-card" style="padding: 2rem; height: fit-content;">
        <h3 style="margin-bottom: 1.5rem;">Input Transaksi Baru</h3>
        <form hx-post="/api/finance/entry" hx-target="#journal-list" hx-on::after-request="this.reset()">
            <div class="form-group">
                <label>Jenis Transaksi</label>
                <select name="type" class="form-control" required>
                    <option value="revenue" style="color: #000;">Penerimaan Kas (+)</option>
                    <option value="expenditure" style="color: #000;">Pengeluaran Kas (-)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Jumlah (IDR)</label>
                <input type="number" name="amount" class="form-control" required placeholder="0">
            </div>
            <div class="form-group" style="margin-bottom: 2rem;">
                <label>Keterangan</label>
                <textarea name="description" class="form-control" rows="3" required placeholder="Contoh: Penerimaan Simpanan Pokok Ahmad"></textarea>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Simpan Transaksi</button>
        </form>
    </div>

    <!-- Journal History -->
    <div class="glass-card" style="padding: 2rem;">
        <h3 style="margin-bottom: 1.5rem;">Jurnal Transaksi Terbaru</h3>
        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; color: var(--text-muted); font-size: 0.85rem; border-bottom: 1px solid var(--glass-border);">
                        <th style="padding: 0.75rem;">Keterangan</th>
                        <th style="padding: 0.75rem;">Referensi</th>
                        <th style="padding: 0.75rem; text-align: right;">Jumlah</th>
                    </tr>
                </thead>
                <tbody id="journal-list">
                    {% include "finance/journal_rows.html" %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>
{% endblock %}

<!-- Floating AI Chatbot Widget -->
<div x-data="{ open: false }" class="fixed bottom-6 right-6 z-[2000] font-outfit">
    <!-- Chat Button -->
    <button @click="open = !open" 
            class="w-16 h-16 rounded-full shadow-2xl flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95"
            style="background: var(--accent-gold); border: 2px solid var(--glass-border);">
        <svg x-show="!open" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-bg-base" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        </svg>
        <svg x-show="open" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-bg-base" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display: none;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>

    <!-- Chat Window -->
    <div x-show="open" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-10 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-10 scale-95"
         class="absolute bottom-20 right-0 w-80 md:w-96 rounded-2xl overflow-hidden shadow-2xl flex flex-col"
         style="background: var(--glass); backdrop-filter: var(--blur); border: 1px solid var(--glass-border); height: 500px; display: none;">
        
        <!-- Header -->
        <div class="p-4 flex items-center justify-between" style="background: var(--accent-gold); border-bottom: 1px solid var(--glass-border);">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-bg-base">IQ-RA Sharia AI</h3>
                    <p class="text-[10px] text-bg-base/70">Online | Asisten Cerdas</p>
                </div>
            </div>
            <button hx-post="/ai/chat/clear" hx-target="#chat-messages" class="p-1.5 hover:bg-white/20 rounded-lg transition-colors text-bg-base/80" title="Bersihkan Chat">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            </button>
        </div>

        <!-- Chat History -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-black/10">
            <div class="mb-4 text-left">
                <div class="inline-block p-3 rounded-lg bg-emerald-900/40 text-white max-w-[80%] shadow-sm border border-emerald-500/20">
                    <p class="text-sm">Assalamu'alaikum! Saya adalah asisten Sharia IQ-RA. Ada yang bisa saya bantu terkait akad atau pembiayaan?</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <form hx-post="/ai/chat" 
              hx-target="#chat-messages" 
              hx-swap="beforeend" 
              hx-indicator="#floating-chat-loading"
              hx-on::after-request="this.reset(); document.getElementById('chat-messages').scrollTo({top: document.getElementById('chat-messages').scrollHeight, behavior: 'smooth'})"
              class="p-3 bg-black/20 border-t border-glass-border relative">
            
            <!-- Loading Indicator -->
            <div id="floating-chat-loading" class="htmx-indicator absolute -top-10 left-1/2 -translate-x-1/2 bg-emerald-900/80 px-3 py-1 rounded-full border border-emerald-500/30 text-[10px] text-white flex items-center gap-2">
                <span class="animate-spin h-2 w-2 border border-white border-t-transparent rounded-full"></span>
                Berpikir...
            </div>

            <div class="flex gap-2">
                <input type="text" 
                       name="message" 
                       placeholder="Tanya tentang akad syariah..." 
                       class="flex-1 bg-white/5 border border-glass-border rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-gold-solid transition-colors text-white"
                       required>
                <button type="submit" 
                        class="p-2 rounded-xl bg-gold-solid hover:bg-gold-muted transition-colors text-bg-base">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Tailwind fallback styles if not fully loaded -->
<style>
    .font-outfit { font-family: 'Outfit', sans-serif; }
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-track { background: transparent; }
    #chat-messages::-webkit-scrollbar-thumb { background: rgba(251, 191, 36, 0.2); border-radius: 10px; }
    
    .htmx-indicator {
        opacity: 0;
        transition: opacity 200ms ease-in;
        pointer-events: none;
    }
    .htmx-request .htmx-indicator {
        opacity: 1;
    }
    .animate-spin {
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
</style>

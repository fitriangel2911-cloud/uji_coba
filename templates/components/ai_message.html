{% if is_ai %}
<div class="chat-msg bot animate-up" style="align-self: flex-start; max-width: 90%; margin-bottom: 1rem;">
    <div style="padding: 1rem 1.25rem; border-radius: 0 16px 16px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); font-size: 0.95rem; line-height: 1.6; color: #fff;">
        {{ message | safe }}
    </div>
    {% if sources %}
    <div style="margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.4rem; padding-left: 0.5rem;">
        {% for source in sources %}
        <span style="font-size: 0.65rem; background: rgba(251, 191, 36, 0.1); color: var(--accent-gold); padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(251, 191, 36, 0.2);">
            📄 {{ source }}
        </span>
        {% endfor %}
    </div>
    {% endif %}
</div>
{% else %}
<div class="chat-msg user animate-up" style="align-self: flex-end; max-width: 90%; padding: 1rem 1.25rem; border-radius: 16px 16px 0 16px; background: var(--accent); color: #fff; font-size: 0.95rem; line-height: 1.6; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); margin-bottom: 1rem;">
    {{ message }}
</div>
{% endif %}

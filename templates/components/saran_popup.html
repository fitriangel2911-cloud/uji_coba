{% if sarans %}
<div class="saran-popup-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; max-width: 350px; display: flex; flex-direction: column; gap: 10px;">
    {% for saran in sarans %}
    <div class="glass-card popup-animation" style="padding: 1rem; border-left: 4px solid var(--accent-gold); box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
            <div style="font-weight: 700; color: var(--accent-gold); font-size: 0.9rem;">
                <i class="fas fa-exclamation-circle"></i> Pesan dari DPS
            </div>
            <button onclick="this.closest('.glass-card').remove()" style="background: none; border: none; color: var(--text-muted); cursor: pointer;">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div style="font-size: 0.85rem; color: #fff; margin-bottom: 0.5rem;">
            <strong>Terkait Anggota ID:</strong> {{ saran.member_id[:8] }}...
        </div>
        <div style="font-size: 0.85rem; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 0.5rem; border-radius: 4px;">
            "{{ saran.saran_text }}"
        </div>
        <div style="font-size: 0.7rem; color: var(--text-muted); text-align: right; margin-top: 0.5rem;">
            Oleh: {{ saran.dps_name }}
        </div>
    </div>
    {% endfor %}
</div>

<style>
@keyframes slideInRight {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
.popup-animation {
    animation: slideInRight 0.3s ease-out forwards;
}
</style>
{% endif %}

{% extends "base.html" %}

{% block page_title %}Manajemen Keanggotaan (KYC){% endblock %}

{% block content %}
<div class="animate-up">
    <!-- Header & Search -->
    <div class="glass-card" style="padding: 2rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 style="margin: 0;">Portal Keanggotaan</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0.5rem 0 0 0;">Kelola pendaftaran calon anggota dan daftar anggota aktif.</p>
        </div>
        <input type="text" name="q" placeholder="Cari NIK atau Nama..." class="form-control" style="max-width: 350px;" 
               hx-get="/kyc" hx-trigger="keyup changed delay:500ms" hx-target="#kyc-main-content">
    </div>

    <div id="kyc-main-content">
        {% include "kyc/admin_index_content.html" %}
    </div>
</div>
{% endblock %}

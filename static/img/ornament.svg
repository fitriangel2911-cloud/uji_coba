<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <style>
    .line {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1;
      stroke-opacity: 0.07;
    }
  </style>
  <!-- Beautiful 8-fold Islamic Geometric Pattern -->
  <g class="line">
    <!-- Outer Square/Stars -->
    <path d="M 0 0 L 80 80 M 80 0 L 0 80 M 40 0 L 40 80 M 0 40 L 80 40"/>
    <path d="M 40 0 L 80 40 L 40 80 L 0 40 Z"/>
    <path d="M 20 20 L 60 20 L 60 60 L 20 60 Z"/>
    <!-- Interlacing Star Elements -->
    <circle cx="40" cy="40" r="20"/>
    <circle cx="40" cy="40" r="30"/>
    <circle cx="0" cy="0" r="10"/>
    <circle cx="80" cy="0" r="10"/>
    <circle cx="80" cy="80" r="10"/>
    <circle cx="0" cy="80" r="10"/>
    <circle cx="40" cy="0" r="15"/>
    <circle cx="80" cy="40" r="15"/>
    <circle cx="40" cy="80" r="15"/>
    <circle cx="0" cy="40" r="15"/>
  </g>
</svg>
